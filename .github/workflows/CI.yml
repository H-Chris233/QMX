name: Full-Stack CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --no-optional
        env:
          CYPRESS_INSTALL_BINARY: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Rollup native modules
        run: pnpm add -D -w @rollup/rollup-linux-x64-gnu || echo "Rollup native modules already installed"

      - name: Build Vue Frontend
        run: pnpm build:frontend
        env:
          CI: true

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Clear corrupted cache
        run: |
          rm -rf ~/.pnpm-store
          pnpm store prune --force

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile --no-optional
        env:
          PNPM_STATE_DIR: /tmp/pnpm-state
          CYPRESS_INSTALL_BINARY: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build Express Backend
        run: pnpm build:backend

      - name: Test Express Backend
        run: pnpm test:backend