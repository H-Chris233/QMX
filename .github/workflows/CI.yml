name: Full-Stack CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Build Vue Frontend
        run: pnpm build
        env:
          CI: true

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Clear corrupted cache
        run: |
          rm -rf ~/.pnpm-store
          pnpm store prune --force

      - name: Install backend dependencies
        run: pnpm install --filter ./backend --frozen-lockfile --no-optional
        env:
          PNPM_STATE_DIR: /tmp/pnpm-state

      - name: Build Express Backend
        run: pnpm run --filter ./backend build

      - name: Test Express Backend
        run: pnpm test --filter ./backend